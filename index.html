<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5e8dc" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Una dedicatoria hecha con intención para Natalia." />
  <title>Para Natalia ✨</title>

  <script>document.documentElement.classList.add('js');</script>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <noscript>
    <style>
      .intro { display:none !important; }
      .scene { display:block !important; padding:20px !important; }
      .right { display:none !important; }
    </style>
  </noscript>

  <!-- Intro -->
  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="intro-card">
      <div class="intro-title" id="introTitle">Natalia…</div>
      <div class="intro-sub">
        Esto es para mi niña preciosa y la mujer de mis ojos.
        Espero que te guste tanto como a mí me gustó hacerlo. ❤️
      </div>

      <div class="intro-actions">
        <button id="btnStart" class="btn" type="button" aria-describedby="introTitle">
          Iniciar
        </button>
      </div>

      <div class="intro-hint">Tip: si vas a poner música, usa audífonos 😉</div>
    </div>
  </div>

  <!-- Scene -->
  <main class="scene" id="scene" aria-label="Dedicatoria para Natalia">
    <section class="left" aria-label="Mensaje">
      <div class="label">Para</div>
      <h1 id="name">Natalia</h1>

      <p id="typed" class="typed" aria-live="polite"></p>

      <div class="counter" aria-label="Contador">
        <div id="counterTitle" class="counter-title">—</div>
        <div id="time" class="time">—</div>
      </div>

      <!-- Galería -->
      <section id="gallery" class="gallery hidden" aria-label="Galería de fotos">
        <div class="gallery-head">
          <div class="gallery-title">Nuestros momentos</div>
          <div class="gallery-sub">Desliza o usa las flechas ✨</div>
        </div>

        <div class="slider-wrap">
          <button id="prev" class="navbtn" type="button" aria-label="Anterior" disabled>‹</button>
          <div id="slider" class="slider" tabindex="0" aria-label="Fotos" role="region"></div>
          <button id="next" class="navbtn" type="button" aria-label="Siguiente" disabled>›</button>
        </div>

        <div class="dots" id="dots" aria-label="Indicadores"></div>
      </section>

      <div class="actions" aria-label="Acciones">
        <button id="btnSurprise" class="btn btn-ghost" type="button" disabled>Sorpresa ✨</button>
        <button id="btnReplay" class="btn btn-ghost" type="button" disabled>Repetir 🌱</button>
      </div>

      <div class="footer-note">Hecho con paciencia, intención y un poquito de código.</div>
    </section>

    <!-- Panel derecho -->
    <section class="right" aria-label="Animación">
      <canvas id="canvas" aria-label="Árbol y corazones animados"></canvas>

      <!-- ✅ Siluetas: encima del canvas, usando tu PNG real -->
      <img
        id="siluetas"
        class="siluetas"
        src="./img/siluetas.png"
        alt=""
        aria-hidden="true"
        loading="eager"
        decoding="async"
      />

      <div class="ground"></div>
    </section>
  </main>

  <!-- JS al final + defer -->
  <script src="./script.js" defer></script>
</body>
</html>
